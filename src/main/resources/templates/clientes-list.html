<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Listado de Clientes</h2>

        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">
            + Añadir Cliente
        </a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Género</th>
                <th>Intolerancia</th>
                <th>Detalle</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.id}"></td>
                <td th:text="${cliente.nombre}"></td>
                <td th:text="${cliente.edad}"></td>
                <td th:text="${cliente.genero}"></td>

                <td>
                    <span th:text="${cliente.intolerancia} ? 'Sí' : 'No'"></span>
                </td>

                <td th:text="${cliente.detalleIntolerancia}"></td>

                <td class="text-center">
                    <a class="btn btn-sm btn-warning me-2"
                       th:href="@{'/clientes/editar/' + ${cliente.id}}">
                        Editar
                    </a>

                    <a class="btn btn-sm btn-danger"
                       th:href="@{'/clientes/eliminar/' + ${cliente.id}}"
                       onclick="return confirm('¿Seguro que deseas eliminar este cliente?')">
                        Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments/footer :: footer "></div>


</body>
</html>
