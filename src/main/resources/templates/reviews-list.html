<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/header :: header"></head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Listado de Reviews</h2>

        <a class="btn btn-primary" th:href="@{/reviews/nuevo}">
            <i class="bi bi-plus-circle"></i> Añadir Review
        </a>
    </div>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Descripción</th>
            <th>Valoración</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="review : ${reviews}">
            <td th:text="${review.id}"></td>
            <td th:text="${review.cliente != null ? review.cliente.nombre : 'Sin cliente'}"></td>
            <td th:text="${review.descripcion}"></td>
            <td th:text="${review.valoracion}"></td>

            <td class="text-center">
                <a class="btn btn-sm btn-warning me-2"
                   th:href="@{'/reviews/editar/' + ${review.id}}">
                    <i class="bi bi-pencil"></i> Editar
                </a>

                <a class="btn btn-sm btn-danger"
                   th:href="@{'/reviews/eliminar/' + ${review.id}}"
                   onclick="return confirm('¿Seguro que deseas eliminar esta review?')">
                    <i class="bi bi-trash"></i> Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments/footer :: footer "></div>


</body>
</html>
